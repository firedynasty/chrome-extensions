<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #fff;
      text-align: center;
    }
    .selector-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }
    .selector-row label {
      font-size: 11px;
      color: #81C784;
      font-weight: 600;
      white-space: nowrap;
    }
    .selector-row select {
      flex: 1;
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid rgba(76, 175, 80, 0.4);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      min-width: 0;
    }
    .selector-row select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 6px rgba(76, 175, 80, 0.3);
    }
    #trackTitle {
      text-align: center;
      font-size: 13px;
      color: #c9a84c;
      margin-bottom: 12px;
      min-height: 36px;
      line-height: 1.4;
    }
    #progress-bar {
      width: 100%;
      height: 6px;
      background: #16213e;
      border-radius: 3px;
      margin-bottom: 8px;
      cursor: pointer;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #c9a84c;
      border-radius: 3px;
      transition: width 0.3s linear;
    }
    #timeDisplay {
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
      background: #2c3e50;
    }
    button:hover {
      background: #34495e;
    }
    #playBtn {
      background: #c9a84c;
      color: #1a1a2e;
      font-size: 20px;
    }
    #playBtn:hover {
      background: #d4b95c;
    }
    #status {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .volume-row span {
      font-size: 14px;
    }
    .volume-row input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: #16213e;
      border-radius: 2px;
      outline: none;
    }
    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #c9a84c;
      cursor: pointer;
    }
    #trackList {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      border-top: 1px solid #333;
      padding-top: 8px;
    }
    .track-item {
      padding: 5px 8px;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item:hover {
      background: #16213e;
      color: #e0e0e0;
    }
    .track-item.active {
      color: #c9a84c;
      background: #16213e;
    }
  </style>
</head>
<body>
  <h2>Music Player</h2>
  <div class="selector-row">
    <label for="genreSelect">Genre:</label>
    <select id="genreSelect"></select>
    <label for="albumSelect">Album:</label>
    <select id="albumSelect"></select>
  </div>
  <div id="trackTitle">Click play to start</div>
  <div id="ytLink" style="text-align:center; margin-bottom:4px; display:none;">
    <a id="ytAnchor" href="#" target="_blank"
       style="color:#FF4040; font-size:11px; text-decoration:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      &#9654; YouTube
    </a>
  </div>
  <div style="text-align:center; margin-bottom:6px;">
    <a href="https://vercel-youtubeviewer.vercel.app/famous-beats-maker_1.html" target="_blank"
       style="color:#c9a84c; font-size:11px; text-decoration:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      &#9654; Famous Beats Maker
    </a>
  </div>
  <div class="volume-row">
    <span>&#128264;</span>
    <input type="range" id="volume" min="0" max="100" value="80">
    <span>&#128266;</span>
  </div>
  <div class="volume-row">
    <span style="font-size:11px; color:#81C784; font-weight:600;">Speed (,/.)</span>
    <button id="rateDown" style="flex:0 0 auto; padding:4px 10px; font-size:12px;">&laquo;</button>
    <span id="rateLabel" style="flex:1; text-align:center; font-size:12px; color:#c9a84c;">1x</span>
    <button id="rateUp" style="flex:0 0 auto; padding:4px 10px; font-size:12px;">&raquo;</button>
  </div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="timeDisplay">0:00 / 0:00</div>
  <div class="btn-row">
    <button id="prevBtn">&#9664;&#9664;</button>
    <button id="playBtn" title="Play/Pause (0)">&#9654;</button>
    <button id="nextBtn">&#9654;&#9654;</button>
  </div>
  <div class="btn-row">
    <button id="shuffleBtn" title="Shuffle">&#128256;</button>
    <button id="noiseBtn" title="White Noise">&#127754;</button>
    <button id="timer3minBtn" title="Play 3 min, rewind, repeat x8" style="background:linear-gradient(45deg,#ff9800,#f57c00);padding:6px 12px;font-size:12px">⏱️ 3m</button>
  </div>
  <div class="volume-row" style="margin-bottom:8px;">
    <span style="font-size:13px;">&#127754;</span>
    <button id="noiseVolDown" style="flex:0 0 auto; padding:4px 10px; font-size:12px;">&#8722;</button>
    <span id="noiseVolLabel" style="flex:1; text-align:center; font-size:12px; color:#888;">10%</span>
    <button id="noiseVolUp" style="flex:0 0 auto; padding:4px 10px; font-size:12px;">+</button>
  </div>
  <!-- Beats Maker panel -->
  <div style="border-top:1px solid #333; padding-top:6px; margin-top:4px; margin-bottom:4px;">
    <button id="beatsPanelToggleBtn" style="width:100%; padding:5px 8px; border:none; border-radius:4px; background:#16213e; color:#81C784; font-size:11px; font-weight:600; cursor:pointer; text-align:left;">▼ Beats Maker</button>
  </div>
  <div id="beatsPanel" style="display:block; margin-bottom:8px;">
    <div style="display:flex; gap:5px; margin-bottom:6px; align-items:center;">
      <select id="beatsPresetSelect" style="flex:1; background:#16213e; color:#e0e0e0; border:1px solid rgba(76,175,80,0.4); border-radius:6px; padding:4px 6px; font-size:11px; font-family:inherit; cursor:pointer; min-width:0;">
        <option value="">— load presets.json —</option>
      </select>
      <button id="beatsLoadBtn" style="flex:0 0 auto; padding:4px 8px; border:1px solid rgba(76,175,80,0.4); border-radius:4px; background:#16213e; color:#81C784; font-size:10px; font-weight:600; cursor:pointer; white-space:nowrap;">Load .json</button>
      <button id="beatsDbxLoadBtn" style="flex:0 0 auto; padding:4px 8px; border:1px solid rgba(76,175,80,0.4); border-radius:4px; background:#16213e; color:#81C784; font-size:10px; font-weight:600; cursor:pointer; white-space:nowrap;">⬇ Dropbox</button>
      <input type="file" id="beatsFileInput" accept=".json" style="display:none;">
    </div>
    <div style="font-size:9px; color:#444; margin-bottom:4px; text-align:center; letter-spacing:.02em;">/vercel/presets_8steps.json</div>
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
      <button id="beatsPlayBtn" style="flex:0 0 auto; padding:5px 14px; border:none; border-radius:4px; background:#c9a84c; color:#1a1a2e; font-size:13px; font-weight:700; cursor:pointer;">▶</button>
      <span style="font-size:11px; color:#81C784; font-weight:600; white-space:nowrap;">BPM</span>
      <input type="range" id="beatsBpmSlider" min="40" max="220" value="120" style="flex:1; height:4px; -webkit-appearance:none; background:#0d1117; border-radius:2px; outline:none;">
      <span id="beatsBpmLabel" style="font-size:12px; color:#c9a84c; min-width:28px; text-align:right;">120</span>
    </div>
    <div id="beatsGrid" style="background:#0d1117; border-radius:6px; padding:5px 4px;"></div>
    <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
      <span style="font-size:11px; color:#81C784; font-weight:600;">Vol</span>
      <input type="range" id="beatsVolSlider" min="0" max="100" value="70" style="flex:1; height:4px; -webkit-appearance:none; background:#0d1117; border-radius:2px; outline:none;">
    </div>
    <div id="beatsStatus" style="font-size:10px; color:#666; text-align:center; min-height:14px; margin-top:4px;"></div>
    <div style="display:flex; gap:4px; margin-top:6px; align-items:center;">
      <input type="password" id="beatsDbxToken" placeholder="dropbox.com/developers/apps"
             style="flex:1; background:#0d1117; color:#e0e0e0; border:1px solid rgba(76,175,80,0.25);
                    border-radius:4px; padding:4px 6px; font-size:10px; font-family:inherit; min-width:0;">
      <button id="beatsDbxSetBtn"
              style="flex:0 0 auto; padding:4px 8px; border:1px solid rgba(76,175,80,0.4);
                     border-radius:4px; background:#16213e; color:#81C784; font-size:10px;
                     font-weight:600; cursor:pointer; white-space:nowrap;">Set</button>
      <button id="beatsDbxSaveBtn"
              style="flex:0 0 auto; padding:4px 8px; border:1px solid rgba(76,175,80,0.4);
                     border-radius:4px; background:#16213e; color:#81C784; font-size:10px;
                     font-weight:600; cursor:pointer; white-space:nowrap;">⬆ Dropbox</button>
    </div>
    <input type="text" id="beatsDbxReplaceName" placeholder="Replace if nonempty, append with value"
           style="width:100%; margin-top:4px; background:#0d1117; color:#e0e0e0;
                  border:1px solid rgba(76,175,80,0.25); border-radius:4px;
                  padding:4px 6px; font-size:10px; font-family:inherit; box-sizing:border-box;">
  </div>

  <div id="trackList"></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
