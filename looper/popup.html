<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #fff;
      text-align: center;
    }
    .hint {
      font-size: 11px;
      color: #999;
      line-height: 1.5;
      margin-top: 10px;
    }
    .hint code {
      color: #26c6da;
      font-size: 10px;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      color: #aaa;
    }
    .error { color: #e74c3c !important; }
  </style>
</head>
<body>
  <h2>🔁 Loop Mix</h2>
  <div class="hint">
    Opening the segment looper on the current page's video/audio…<br>
    One segment per line: <code>start, end, [loops]</code><br>
    <code>1:30, 1:44</code> · <code>2:00, 2:10, 5</code> · <code>3:00, 15, 3</code> (plain-number end = duration)
  </div>
  <div id="status">Applies to current tab only</div>
  <script src="popup.js"></script>
</body>
</html>
