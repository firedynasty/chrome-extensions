<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Word Definer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0d0d1a;
      color: #e0e0e0;
    }

    /* ── top controls bar ── */
    #controls-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0d0d1a;
      border-bottom: 2px solid rgba(62, 166, 255, 0.333);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #controls-bar .title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-right: 4px;
    }
    #controls-bar .divider {
      width: 1px;
      height: 20px;
      background: rgba(62, 166, 255, 0.267);
      flex-shrink: 0;
    }
    #toggle-btn {
      padding: 5px 14px;
      border: none;
      border-radius: 5px;
      background: #3ea6ff;
      color: #000;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    #toggle-btn.active {
      background: #2ecc71;
      color: #000;
    }
    #toggle-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #status-flash {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      min-width: 10px;
    }

    /* ── dictionary section ── */
    #dict-section {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dict-row {
      background: #1a1a2e;
      border: 1px solid rgba(62, 166, 255, 0.15);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .dict-row-title {
      font-size: 11px;
      font-weight: 700;
      color: #AB47BC;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .dict-status {
      font-size: 12px;
      color: #888;
      margin-bottom: 7px;
    }
    .dict-status.loaded { color: #2ecc71; }
    .dict-status.error  { color: #e74c3c; }
    .pick-btn {
      padding: 4px 11px;
      border: 1px solid rgba(62, 166, 255, 0.3);
      border-radius: 5px;
      background: #22223a;
      color: #e0e0e0;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .pick-btn:hover   { background: #2c2c4a; }
    .pick-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── progress ── */
    .progress-wrap { display: none; margin-top: 8px; }
    .progress-label { font-size: 11px; color: #666; margin-bottom: 3px; }
    .progress-bar  { height: 3px; background: #2a2a44; border-radius: 2px; }
    .progress-fill { height: 100%; background: #AB47BC; border-radius: 2px; width: 0%; transition: width 0.1s; }
    .warn-msg { font-size: 10px; color: rgba(255,167,38,0.8); margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <div id="controls-bar">
    <span class="title">Word Definer</span>
    <span class="divider"></span>
    <button id="toggle-btn" title="Toggle word lookup on this tab">Activate</button>
    <span id="status-flash"></span>
  </div>

  <div id="dict-section">
    <div class="dict-row">
      <div class="dict-row-title">General Dictionary</div>
      <div class="dict-status" id="dict-status">Not loaded — using online API</div>
      <button class="pick-btn" id="dict-btn">Choose dictionary_slim.json</button>
      <input type="file" id="dict-file" accept=".json" style="display:none">
      <div class="progress-wrap" id="dict-progress">
        <div class="progress-label" id="dict-label">Importing…</div>
        <div class="progress-bar"><div class="progress-fill" id="dict-bar"></div></div>
        <div class="warn-msg" id="dict-warn">Keep this popup open during import.</div>
      </div>
    </div>

    <div class="dict-row">
      <div class="dict-row-title">Archaic Word Catalog</div>
      <div class="dict-status" id="archaic-status">Not loaded</div>
      <button class="pick-btn" id="archaic-btn">Choose archaic_words.json</button>
      <input type="file" id="archaic-file" accept=".json" style="display:none">
      <div class="progress-wrap" id="archaic-progress">
        <div class="progress-label" id="archaic-label">Importing…</div>
        <div class="progress-bar"><div class="progress-fill" id="archaic-bar"></div></div>
        <div class="warn-msg" id="archaic-warn">Keep this popup open during import.</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
